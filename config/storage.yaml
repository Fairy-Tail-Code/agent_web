qiniu:
  bucket_name: ${QINIU_BUCKET_NAME}
  domain: ${QINIU_DOMAIN}
  access_key: ${QINIU_ACCESS_KEY}
  secret_key: ${QINIU_SECRET_KEY}

path_prefixes:
  knowledge: "knowledge"
  data: "data"
  office: "office"

expiration:
  knowledge_days: 30  # 30天后过期（1个月）
  data_days: 30  # 30天后过期（1个月）
  office_days: 30  # 30天后过期（1个月）
