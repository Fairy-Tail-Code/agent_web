name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:  # 允许手动触发

env:
  DOCKERHUB_REPO: zhangwei12138

jobs:
  # ── 构建并推送镜像 ──────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Checkout frontend (sibling dir)
        uses: actions/checkout@v4
        with:
          repository: Fairy-Tail-Code/agent-web-fronted
          path: agent-web-fronted
          token: ${{ secrets.GH_PAT }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 构建后端 Python 镜像（app / data-mcp / docx-use-mcp 共用）──
      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPO }}/agent-backend:${{ github.sha }}
            ${{ env.DOCKERHUB_REPO }}/agent-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 构建前端 adapter 镜像 ──
      - name: Build & push frontend-adapter image
        uses: docker/build-push-action@v6
        with:
          context: ./agent-web-fronted
          file: ./agent-web-fronted/Dockerfile.adapter
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPO }}/agent-frontend-adapter:${{ github.sha }}
            ${{ env.DOCKERHUB_REPO }}/agent-frontend-adapter:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 构建 gateway (nginx + 前端静态资源) ──
      # gateway Dockerfile 的 context 原本是 .. (父目录)，因为要 COPY agent-web-fronted/
      # CI 中前端已 clone 为子目录 agent-web-fronted，所以 context 用当前目录即可
      # 但 Dockerfile 里 COPY 路径是 agent-web-fronted/xxx，我们需要在根目录下有这个目录
      - name: Move frontend for gateway build context
        run: |
          # Dockerfile 里用 agent-web-fronted-2/... 路径，在 context=. 下刚好能找到
          ls -la agent-web-fronted-2/ | head -5

      - name: Build & push gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/nginx/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPO }}/agent-gateway:${{ github.sha }}
            ${{ env.DOCKERHUB_REPO }}/agent-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 部署到服务器 ──────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e

            DEPLOY_DIR=/opt/agent_web
            BACKEND_DIR=$DEPLOY_DIR/agent_web

            # 首次部署：克隆仓库
            if [ ! -d "$BACKEND_DIR/.git" ]; then
              mkdir -p $DEPLOY_DIR
              git clone https://github.com/iamikunnnnn/agent_web.git $BACKEND_DIR
            fi

            # 拉取最新代码（需要 docker-compose.prod.yaml 和 nginx 配置等）
            cd $BACKEND_DIR
            git fetch origin main
            git reset --hard origin/main

            # 确保 .env 存在
            if [ ! -f ".env" ]; then
              echo "❌ .env 文件不存在！请先在服务器上手动创建 $BACKEND_DIR/.env"
              exit 1
            fi

            # 用生产 compose 文件启动（只拉取镜像，不构建）
            docker compose -f docker-compose.prod.yaml pull
            docker compose -f docker-compose.prod.yaml down --remove-orphans
            docker compose -f docker-compose.prod.yaml up -d

            # 等待启动完成
            sleep 15
            docker compose -f docker-compose.prod.yaml ps
            echo "✅ 部署完成！"
