name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:  # 允许手动触发

env:
  DOCKERHUB_REPO: zhangwei12138

jobs:
  # ── 构建并推送镜像 ──────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Checkout frontend (sibling dir)
        uses: actions/checkout@v4
        with:
          repository: Fairy-Tail-Code/agent-web-fronted
          path: agent-web-fronted
          token: ${{ secrets.GH_PAT }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 构建后端 Python 镜像（app / data-mcp / docx-use-mcp 共用）──
      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPO }}/agent-backend:${{ github.sha }}
            ${{ env.DOCKERHUB_REPO }}/agent-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 构建前端 adapter 镜像 ──
      - name: Build & push frontend-adapter image
        uses: docker/build-push-action@v6
        with:
          context: ./agent-web-fronted
          file: ./agent-web-fronted/Dockerfile.adapter
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPO }}/agent-frontend-adapter:${{ github.sha }}
            ${{ env.DOCKERHUB_REPO }}/agent-frontend-adapter:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 构建 gateway (nginx + 前端静态资源) ──
      # gateway Dockerfile 的 context 原本是 .. (父目录)，因为要 COPY agent-web-fronted/
      # CI 中前端已 clone 为子目录 agent-web-fronted，所以 context 用当前目录即可
      # 但 Dockerfile 里 COPY 路径是 agent-web-fronted/xxx，我们需要在根目录下有这个目录
      - name: Move frontend for gateway build context
        run: |
          # Dockerfile 里用 agent-web-fronted-2/... 路径，在 context=. 下刚好能找到
          ls -la agent-web-fronted-2/ | head -5

      - name: Build & push gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/nginx/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPO }}/agent-gateway:${{ github.sha }}
            ${{ env.DOCKERHUB_REPO }}/agent-gateway:latest
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 部署到服务器 ──────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      # 安装 sshpass 用于 scp/ssh
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      # 用 scp 直接把配置文件传到服务器
      - name: Transfer config files
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_PASS: ${{ secrets.SERVER_PASSWORD }}
          SSH_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          DEPLOY_DIR=/opt/agent_web/agent_web
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p $DEPLOY_DIR/deploy/nginx/ssl"
          sshpass -p "$SSH_PASS" scp -o StrictHostKeyChecking=no -P "$SSH_PORT" \
            docker-compose.prod.yaml \
            "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/docker-compose.prod.yaml"
          sshpass -p "$SSH_PASS" scp -o StrictHostKeyChecking=no -P "$SSH_PORT" \
            deploy/nginx/nginx.conf \
            "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/deploy/nginx/nginx.conf"
          sshpass -p "$SSH_PASS" scp -o StrictHostKeyChecking=no -P "$SSH_PORT" \
            deploy/nginx/jwt_verify.lua \
            "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/deploy/nginx/jwt_verify.lua"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e

            DEPLOY_DIR=/opt/agent_web/agent_web
            cd $DEPLOY_DIR

            # 确保 .env 存在
            if [ ! -f ".env" ]; then
              echo "❌ .env 文件不存在！请先在服务器上手动创建 $DEPLOY_DIR/.env"
              exit 1
            fi

            # 拉取最新镜像并启动
            docker compose -f docker-compose.prod.yaml pull
            docker compose -f docker-compose.prod.yaml down --remove-orphans
            docker compose -f docker-compose.prod.yaml up -d

            # 等待启动完成
            sleep 15
            docker compose -f docker-compose.prod.yaml ps
            echo "✅ 部署完成！"
