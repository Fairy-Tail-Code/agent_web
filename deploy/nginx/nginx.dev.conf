worker_processes auto;

error_log /dev/stderr warn;
pid /var/run/nginx.pid;

env SUPABASE_JWT_SECRET;
env SUPABASE_URL;
env SUPABASE_JWKS_URL;
env SUPABASE_JWT_AUDIENCE;

events {
    worker_connections 1024;
}

http {
    lua_package_path "/etc/openresty/?.lua;/usr/local/openresty/site/lualib/?.lua;/usr/local/openresty/site/lualib/?/init.lua;/usr/local/openresty/lualib/?.lua;/usr/local/openresty/lualib/?/init.lua;;";
    lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    lua_ssl_verify_depth 5;

    resolver 127.0.0.11 ipv6=off valid=300s;
    resolver_timeout 5s;

    lua_shared_dict rate_limit 10m;
    lua_shared_dict resty_jwt_verification_cache_jwks 2m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;

    init_by_lua_block {
        local jwt_verify = require "jwt_verify"
        jwt_verify.init()
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    log_format main '$remote_addr - [$time_local] "$request" '
                    '$status $body_bytes_sent '
                    '"$http_user_agent" '
                    'upstream_response_time=$upstream_response_time';

    access_log /dev/stdout main;

    server {
        listen 80;
        server_name localhost;

        root /usr/local/openresty/nginx/html;
        index index.html;

        server_tokens off;

        client_max_body_size 100m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;

        # CORS 开发环境允许所有来源
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;

        add_header X-Content-Type-Options nosniff always;

        location = /health {
            default_type text/plain;
            return 200 "ok";
        }

        location ^~ /api/ {
            limit_req zone=api_limit burst=100 nodelay;
            limit_req_status 429;

            access_by_lua_block {
                local jwt_verify = require "jwt_verify"
                jwt_verify.verify()
            }

            proxy_pass http://frontend-adapter:4000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_cache off;
        }

        location ^~ /agui/ {
            limit_req zone=api_limit burst=100 nodelay;
            limit_req_status 429;

            access_by_lua_block {
                local jwt_verify = require "jwt_verify"
                jwt_verify.verify()
            }

            proxy_pass http://frontend-adapter:4000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_cache off;
        }

        location ^~ /backend/ {
            limit_req zone=api_limit burst=100 nodelay;
            limit_req_status 429;

            access_by_lua_block {
                local jwt_verify = require "jwt_verify"
                jwt_verify.verify()
            }

            proxy_pass http://app:8005/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_cache off;
        }

        location /assets/ {
            access_log off;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}